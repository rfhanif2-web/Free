            { ar: 'الرَّحْمَٰنُ', bn: 'আর-রহমান', meaning: 'পরম করুণাময়', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> আল্লাহতায়ালা এই নামের মাধ্যমে নির্দেশ দিয়েছেন যে, সমগ্র সৃষ্টিজগতের প্রতি দয়া ও করুণা প্রদর্শন করতে হবে। কোনো মানুষ বা প্রাণীর প্রতি নিষ্ঠুর হওয়া যাবে না। মানুষের সাথে লেনদেনে ন্যায়পরায়ণতা বজায় রাখতে হবে এবং দুনিয়াতে ইনসাফ কায়েম করতে হবে।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> বর্তমান যুগে মানুষ চরম স্বার্থপরতা ও বস্তুবাদী মানসিকতায় ডুবে গেছে। ক্ষমতার লোভ এবং সম্পদের মোহে তারা দুর্বলদের অধিকার হরণ করছে, যা সমাজে অশান্তির মূল কারণ।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> মানুষের যাবতীয় মানসিক অবসাদ ও হতাশার সমাধান নিহিত রয়েছে ‘আর-রহমান’ নামের ওপর অটল বিশ্বাসের মাঝে। সংকটে হতাশ না হয়ে আল্লাহর করুণার ওপর ভরসা করে সঠিক পথে অবিচল থাকতে হবে।</p>` },

            { ar: 'الْقُدُّوسُ', bn: 'আল-কুদ্দুস', meaning: 'পবিত্র ও নির্মল', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> মন, চিন্তা, চরিত্র এবং বাহ্যিক জীবনকে হিংসা, অহংকার ও হারাম উপার্জন থেকে পবিত্র রাখতে হবে।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> আধুনিক মানুষের অন্তর আজ লোভ ও কুপ্রবৃত্তিতে কলুষিত হয়ে গেছে।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> নিয়মিত আত্মশুদ্ধি, জিকির ও হালাল উপার্জনের মাধ্যমে মনকে পবিত্র রাখতে হবে।</p>` },
            { ar: 'السَّلَامُ', bn: 'আস-সালাম', meaning: 'শান্তিদাতা', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> সমাজে শান্তি প্রতিষ্ঠা করা এবং মানুষের জীবন ও সম্পদের নিরাপত্তা নিশ্চিত করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> হানাহানি ও পরশ্রীকাতরতা আজকের পৃথিবীকে অশান্ত করে তুলেছে।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> প্রকৃত শান্তিদাতা আল্লাহর সান্নিধ্য অর্জনের মাধ্যমে সম্প্রীতির ভবিষ্যৎ গড়তে হবে।</p>` },
            { ar: 'الْمُؤْمِنُ', bn: 'আল-মু’মিন', meaning: 'নিরাপত্তা দানকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> জীবনের প্রতিটি পদক্ষেপে আল্লাহর ওপর পূর্ণ আস্থা রাখতে হবে এবং সমাজের মানুষের আশ্রয়স্থল হতে হবে।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> মানুষের মনে চরম নিরাপত্তাহীনতা ও ভবিষ্যৎ নিয়ে আতঙ্ক কাজ করছে।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> প্রকৃত নিরাপত্তা দানকারী একমাত্র আল্লাহ। তাঁর ওপর ভরসা করলে অনিশ্চয়তা কেটে যায়।</p>` },
            { ar: 'الْمُهَيْمِنُ', bn: 'আল-হাইমিন', meaning: 'রক্ষণাবেক্ষণকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> আল্লাহ মানুষের প্রতিটি কাজ দেখেন, তাই সবসময় সততার সাথে জীবন যাপন করতে হবে।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> মানুষ গোপনে পাপ কাজ করে মনে করে কেউ দেখছে না।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> নির্জনে বা প্রকাশ্যে আল্লাহর নজরদারির কথা স্মরণ রাখলে গোপন পাপ থেকে বাঁচা যায়।</p>` },

            { ar: 'الغَنِيُّ', bn: 'আল-গণিউ', meaning: 'অমুখাপেক্ষী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> আল্লাহর রিজিকে সন্তুষ্ট থাকা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> অতিরিক্ত লোভ ও কৃপণতা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> মনের তুষ্টি অর্জন।</p>` },
            { ar: 'المُغْنِي', bn: 'আল-মুগনি', meaning: 'অভাবমোচনকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> অভাবমোচনকারী হিসেবে আল্লাহকে মানা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> সম্পদের অহংকার।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> প্রকৃত সমৃদ্ধি অর্জন।</p>` },
            { ar: 'المَانِعُ', bn: 'আল-মানি', meaning: 'নিবারণকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> অকল্যাণ থেকে বাঁচতে সাহায্য চাওয়া।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> অবৈধ উপায়ে অর্জনের চেষ্টা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> নিরাপদ জীবন নিশ্চিত করা।</p>` },
            { ar: 'الضَّارُ', bn: 'আয-দ্বোর', meaning: 'ক্ষতিসাধনকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> সৃষ্টির কাউকে অন্ধের মতো ভয় না করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> মানুষকে অতিরিক্ত ভয় করা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> ভয় দূর করে আত্মিক সাহস বাড়ানো।</p>` },
            { ar: 'النَّافِعُ', bn: 'আন-নাফি', meaning: 'উপকারকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> মানুষের উপকারে নিজেকে নিয়োজিত রাখা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> অন্যের ক্ষতি করার মানসিকতা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> পরোপকারী মনোভাব গঠন।</p>` },
            { ar: 'النُّورُ', bn: 'আন-নূর', meaning: 'আলোকধারক', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> কোরআনের আলো দিয়ে জীবন আলোকিত করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> অজ্ঞতার অন্ধকারে ডুবে থাকা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> হেদায়াতের আলো ছড়ানো।</p>` },
            { ar: 'الهَادِي', bn: 'আল-হাদী', meaning: 'পথপ্রদর্শক', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> সবসময় সঠিক পথের ওপর অবিচল থাকার দোয়া করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> পথভ্রষ্টতা ও গোঁয়ার্তুমি।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> সিরাতুল মুস্তাকিমে চলা।</p>` },
            { ar: 'البَدِيعُ', bn: 'আল-বাদি', meaning: 'অতুলনীয় সৃষ্টিকর্তা', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> সৃষ্টিজগতের সৌন্দর্য রক্ষা করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> পরিবেশ ও প্রকৃতির ধ্বংস সাধন।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> প্রকৃতির প্রতি ভালোবাসা ও যত্ন নেওয়া।</p>` },
            { ar: 'البَاقِي', bn: 'আল-বাকি', meaning: 'চিরস্থায়ী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> অবিনশ্বর আখেরাতের জন্য পুঁজি সংগ্রহ করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> নশ্বর দুনিয়ার পেছনে সর্বস্ব হারানো।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> আখেরাতমুখী সফল জীবন গড়া।</p>` },
            { ar: 'الوَاِرثُ', bn: 'আল-ওয়ারিস', meaning: 'চূড়ান্ত উত্তরাধিকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> সম্পদ একদিন আল্লাহর কাছে ফিরে যাবে—এই চেতনা রাখা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> সম্পদের মোহে কৃপণতা করা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> সম্পদের সঠিক ব্যবহার নিশ্চিত করা।</p>` },
            { ar: 'الرَّشِيدُ', bn: 'আর-রশিদ', meaning: 'সঠিক পথ নির্দেশকারী', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> জীবনের প্রতি সিদ্ধান্তে হিকমত অনুসরণ করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> হটকারী সিদ্ধান্ত নেওয়া।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> বিচক্ষণতা ও দূরদর্শিতা বৃদ্ধি করা।</p>` },
            { ar: 'الصَّبُورُ', bn: 'আস-সবুর', meaning: 'অত্যন্ত ধৈর্যশীল', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> মুসিবতে সবর বা ধৈর্য ধারণ করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> বিপদে অধৈর্য হয়ে নাফরমানি করা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> মানসিক শক্তি ও স্থৈর্য বহুগুণ বাড়িয়ে নেওয়া।</p>` },
            { ar: 'اللَّهُ', bn: 'আল্লাহ (৯৯)', meaning: 'পরম সত্তা', details: `<p>• <strong>আল্লাহর আদেশ ও নির্দেশ:</strong> একমাত্র আল্লাহর ইবাদত করা এবং তাঁর ওপর পূর্ণ সমর্পণ করা।</p><p>• <strong>বর্তমান পরিস্থিতির কারণ:</strong> আল্লাহর পরিবর্তে বস্তু ও ক্ষমতার উপাসনা করা।</p><p>• <strong>ভবিষ্যতের দিকনির্দেশনা ও সমাধান:</strong> জীবনের চূড়ান্ত সফলতা ও জান্নাত অর্জনের জন্য একমাত্র আল্লাহর ওপর সর্বস্ব সমর্পণ করা।</p>` }
        ];

        const customNotes = {};

        const container = document.getElementById('boxes-container');
        const detailModal = document.getElementById('detail-modal');
        const modalBoxNum = document.getElementById('modal-box-num');
        const modalBoxArabic = document.getElementById('modal-box-arabic');
        const modalBoxTitle = document.getElementById('modal-box-title');
        const modalBoxMeaning = document.getElementById('modal-box-meaning');
        const modalDetailsContent = document.getElementById('modal-details-content');
        const adminNoteSection = document.getElementById('admin-note-section');
        const customTextInput = document.getElementById('custom-text-input');
        const modalCancel = document.getElementById('modal-cancel');
        const modalSave = document.getElementById('modal-save');
        const modalCloseIcon = document.getElementById('modal-close-icon');

        const loginModal = document.getElementById('login-modal');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const adminBadge = document.getElementById('admin-badge');
        const adminLogoutBtn = document.getElementById('admin-logout-btn');
        const adminPassInput = document.getElementById('admin-pass-input');
        const loginSubmit = document.getElementById('login-submit');
        const loginCancel = document.getElementById('login-cancel');

        let currentEditingIndex = null;

        function renderGrid() {
            container.innerHTML = '';
            for (let i = 0; i < 99; i++) {
                const item = allahNames[i] || allahNames[98];
                const boxIndex = i + 1;
                const box = document.createElement('div');
                const userNote = customNotes[boxIndex] || '';

                box.className = `min-h-[90px] bg-slate-900 border border-slate-800 hover:border-amber-400/70 rounded-xl p-2.5 flex flex-col justify-between cursor-pointer transition-all duration-200 hover:-translate-y-0.5 shadow-lg relative overflow-hidden group`;

                box.innerHTML = `
                    <div class="flex justify-between items-center z-10">
                        <span class="text-[10px] font-bold text-slate-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">${toBengaliNum(boxIndex)}</span>
                        <span class="arabic-font text-xl text-amber-300 group-hover:scale-110 transition-transform">${item.ar}</span>
                    </div>
                    <div class="z-10 my-1">
                        <h4 class="text-xs sm:text-sm font-bold text-slate-100 group-hover:text-amber-200 truncate">${item.bn}</h4>
                        <p class="text-[10px] text-slate-400 truncate mt-0.5">${item.meaning}</p>
                    </div>
                    <div class="z-10 w-full min-h-[14px]">
                        <span class="note-tag text-[9px] text-cyan-300 bg-cyan-950/90 border border-cyan-800 px-1.5 py-0.5 rounded truncate block ${userNote ? '' : 'hidden'}">${userNote}</span>
                    </div>
                `;

                box.addEventListener('click', () => {
                    currentEditingIndex = boxIndex;
                    modalBoxNum.innerText = `নাম নম্বর: ${toBengaliNum(boxIndex)}`;
                    modalBoxArabic.innerText = item.ar;
                    modalBoxTitle.innerText = item.bn;
                    modalBoxMeaning.innerText = `অর্থ: ${item.meaning}`;
                    modalDetailsContent.innerHTML = item.details;
                    
                    if (isAdmin) {
                        adminNoteSection.classList.remove('hidden');
                        modalSave.classList.remove('hidden');
                        customTextInput.value = customNotes[boxIndex] || '';
                    } else {
                        adminNoteSection.classList.add('hidden');
                        modalSave.classList.add('hidden');
                    }

                    detailModal.classList.remove('hidden');
                });

                container.appendChild(box);
            }
        }

        adminLoginBtn.addEventListener('click', () => { loginModal.classList.remove('hidden'); adminPassInput.value = ''; adminPassInput.focus(); });
        loginCancel.addEventListener('click', () => loginModal.classList.add('hidden'));

        loginSubmit.addEventListener('click', () => {
            const enteredPass = adminPassInput.value;
            
            if (verifyPassword(enteredPass)) {
                isAdmin = true;
                adminLoginBtn.classList.add('hidden');
                adminBadge.classList.remove('hidden');
                adminBadge.classList.add('flex');
                loginModal.classList.add('hidden');
                renderGrid();
            } else {
                alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন (admin@999)।');
            }
        });

        adminLogoutBtn.addEventListener('click', () => {
            isAdmin = false;
            adminBadge.classList.add('hidden');
            adminBadge.classList.remove('flex');
            adminLoginBtn.classList.remove('hidden');
            renderGrid();
        });

        function closeModal() { detailModal.classList.add('hidden'); }
        modalCancel.addEventListener('click', closeModal);
        modalCloseIcon.addEventListener('click', closeModal);

        modalSave.addEventListener('click', () => {
            if (isAdmin && currentEditingIndex) {
                customNotes[currentEditingIndex] = customTextInput.value.trim();
                renderGrid();
            }
            closeModal();
        });

        window.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
